name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BrackenVale.sln
      - name: Test core
        run: dotnet test tests/BrackenVale.Tests/BrackenVale.Tests.csproj --configuration Release --no-restore
      - name: Build WinUI app
        run: dotnet build src/BrackenVale.App/BrackenVale.App.csproj --configuration Release --no-restore -p:Platform=${{ matrix.arch }} -p:RuntimeIdentifier=${{ matrix.rid }} -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
      - name: Upload app build
        uses: actions/upload-artifact@v7
        with:
          name: bracken-vale-${{ matrix.rid }}
          path: src/BrackenVale.App/bin/${{ matrix.arch }}/Release/net10.0-windows10.0.26100.0/${{ matrix.rid }}/
          if-no-files-found: error
