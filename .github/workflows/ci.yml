name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests-linux:
    name: Core tests · Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore core tests
        run: dotnet restore tests/BrackenVale.Tests/BrackenVale.Tests.csproj
      - name: Test core
        run: dotnet test tests/BrackenVale.Tests/BrackenVale.Tests.csproj --configuration Release --no-restore

  test-and-build:
    name: ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BrackenVale.sln
      - name: Test core
        run: dotnet test tests/BrackenVale.Tests/BrackenVale.Tests.csproj --configuration Release --no-restore
      - name: Build WinUI app
        run: dotnet build src/BrackenVale.App/BrackenVale.App.csproj --configuration Release --no-restore -p:Platform=${{ matrix.arch }} -p:RuntimeIdentifier=${{ matrix.rid }} -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
      - name: Publish self-contained portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'artifacts/portable'
          dotnet publish src/BrackenVale.App/BrackenVale.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output $out -p:Platform=${{ matrix.arch }} -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          $archive = 'artifacts/bracken-vale-${{ matrix.rid }}.zip'
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $archive -CompressionLevel Optimal
      - name: Smoke test self-contained x64 startup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/portable/BrackenVale.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $logs = Join-Path $env:LOCALAPPDATA 'BrackenVale/Logs'
              if (Test-Path $logs) { Get-ChildItem $logs -Filter 'bracken-vale-*.log' | Get-Content }
              throw "Bracken Vale exited during startup with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: bracken-vale-${{ matrix.rid }}-portable
          path: artifacts/bracken-vale-${{ matrix.rid }}.zip
          if-no-files-found: error
