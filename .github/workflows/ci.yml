name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests-linux:
    name: Core tests · Linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout v7, pinned to the verified tag commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # actions/setup-dotnet v6, pinned to the verified tag commit.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore core tests
        run: dotnet restore tests/MusicPlayer.Tests/MusicPlayer.Tests.csproj
      - name: Test core
        run: dotnet test tests/MusicPlayer.Tests/MusicPlayer.Tests.csproj --configuration Release --no-restore

  test-and-build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            os: windows-2022
          - arch: ARM64
            rid: win-arm64
            os: windows-11-arm
    steps:
      # actions/checkout v7, pinned to the verified tag commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # actions/setup-dotnet v6, pinned to the verified tag commit.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MusicPlayer.sln
      - name: Test core
        run: dotnet test tests/MusicPlayer.Tests/MusicPlayer.Tests.csproj --configuration Release --no-restore
      - name: Build WinUI app
        run: dotnet build src/MusicPlayer.App/MusicPlayer.App.csproj --configuration Release --no-restore -p:Platform=${{ matrix.arch }} -p:RuntimeIdentifier=${{ matrix.rid }} -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false
      - name: Test native playback and queue transitions
        # Silent WAVs and dummy audio need no device; this harness targets x64.
        if: matrix.arch == 'x64'
        run: dotnet test tests/MusicPlayer.Playback.Tests/MusicPlayer.Playback.Tests.csproj --configuration Release
      - name: Publish self-contained portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'artifacts/publish'
          dotnet publish src/MusicPlayer.App/MusicPlayer.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output $out -p:Platform=${{ matrix.arch }} -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          if ($LASTEXITCODE -ne 0) { throw 'Portable publish failed.' }
          $arch = '${{ matrix.arch }}'.ToLowerInvariant()
          $packageName = "MusicPlayer-ci-$arch-portable"
          $stage = Join-Path $PWD "artifacts/$packageName"
          & packaging/windows/Prepare-PortablePackage.ps1 -PublishDirectory $out -DestinationDirectory $stage -Version 'ci' -Architecture $arch
          if ($LASTEXITCODE -ne 0) { throw 'Portable package preparation failed.' }
          $archive = "artifacts/$packageName.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $archive -CompressionLevel Optimal
      - name: Smoke test self-contained app startup
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'.ToLowerInvariant()
          $packageName = "MusicPlayer-ci-$arch-portable"
          $exe = Join-Path $PWD "artifacts/$packageName/MusicPlayer.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $logs = Join-Path $env:LOCALAPPDATA 'MusicPlayer/Logs'
              if (Test-Path $logs) { Get-ChildItem $logs -Filter 'music-player-*.log' | Get-Content }
              throw "Music Player exited during startup with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload portable build
        # actions/upload-artifact v7, pinned to the verified tag commit.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: music-player-${{ matrix.rid }}-portable
          path: artifacts/MusicPlayer-ci-*-portable.zip
          if-no-files-found: error
