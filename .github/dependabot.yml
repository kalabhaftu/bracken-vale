version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      media-fixture-cache:
        patterns:
          - "actions/cache/*"
  - package-ecosystem: npm
    directory: "/tests/MusicPlayer.Ui.Tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
